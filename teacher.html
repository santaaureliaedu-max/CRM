<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Aurelia — Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1B2A4A;--paper:#F6F4EF;--raised:#fff;--brass:#B08D57;--brass-soft:#e8dcc4;--green:#2F5D50;--green-bg:#e7efec;--rust:#B5502D;--rust-bg:#f6e6df;--slate:#6B7280;--hairline:#d9d4c7;--radius:8px;--serif:'Fraunces',Georgia,serif;--sans:'Inter',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 40px}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 0 20px}
  .crest{width:34px;height:34px;border:1.5px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--brass);font-size:14px}
  .topbar .name{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.1}
  .topbar .name span{display:block;font-size:11px;color:var(--slate);font-family:var(--sans);font-weight:400}
  .topbar .out{margin-left:auto;font-size:13px;color:var(--brass);text-decoration:underline;background:none;border:none}

  /* auth */
  .auth{background:var(--raised);border-radius:var(--radius);padding:26px 22px;margin-top:40px}
  .auth h1{font-family:var(--serif);font-size:22px;margin-bottom:4px}
  .auth p{color:var(--slate);font-size:14px;margin-bottom:20px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);margin:14px 0 5px}
  input,select{width:100%;padding:13px 12px;border:1px solid var(--hairline);border-radius:var(--radius);font-size:16px;font-family:var(--sans);background:#fff}
  .btn{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;background:var(--ink);color:#fff;margin-top:18px}
  .btn:active{background:#2a3d63}
  .btn-sec{background:none;border:1px solid var(--hairline);color:var(--ink);margin-top:10px}
  .link{display:block;text-align:center;margin-top:16px;font-size:14px;color:var(--brass);text-decoration:underline;background:none;border:none;width:100%}
  .msg{font-size:13px;margin-top:12px;min-height:16px}

  .card{background:var(--raised);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .controls{display:flex;gap:10px;margin-bottom:16px}
  .controls>*{flex:1}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--hairline)}
  .stat:last-child{border-bottom:none}
  .stat .who{font-weight:600}
  .stat .who small{display:block;color:var(--slate);font-weight:400;font-size:12px}
  .seg{display:flex;gap:4px}
  .seg button{padding:8px 10px;border:1px solid var(--hairline);background:#fff;border-radius:6px;font-size:12px;font-weight:600;color:var(--slate);min-width:38px}
  .seg button.on[data-s="present"]{background:var(--green-bg);color:var(--green);border-color:var(--green)}
  .seg button.on[data-s="absent"]{background:var(--rust-bg);color:var(--rust);border-color:var(--rust)}
  .seg button.on[data-s="late"]{background:var(--brass-soft);color:var(--brass);border-color:var(--brass)}
  .seg button.on[data-s="excused"]{background:#eceade;color:var(--ink);border-color:var(--slate)}
  .bar{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,var(--paper) 30%)}
  .empty{text-align:center;color:var(--slate);padding:30px 10px;font-size:14px}
  .pending-note{background:var(--brass-soft);border:1px solid var(--brass);border-radius:var(--radius);padding:16px;font-size:14px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <!-- AUTH -->
  <div id="auth" class="auth">
    <h1 id="authTitle">Teacher sign in</h1>
    <p id="authSub">Santa Aurelia attendance</p>
    <div id="nameRow" style="display:none"><label>Your name</label><input id="t_name" placeholder="Full name"></div>
    <label>Email</label><input id="t_email" type="email" autocomplete="username">
    <label>Password</label><input id="t_pass" type="password" autocomplete="current-password">
    <button class="btn" id="authBtn">Sign in</button>
    <button class="link" id="toggleMode" type="button">New here? Create an account</button>
    <button class="link" id="resendConfirm" type="button" style="display:none">Resend verification email</button>
    <div class="msg" id="authMsg" role="status" aria-live="polite"></div>
  </div>

  <!-- APP -->
  <div id="tapp" style="display:none">
    <div class="topbar">
      <div class="crest">SA</div>
      <div class="name">Santa Aurelia<span id="t_who"></span></div>
      <button class="out" id="t_out">Sign out</button>
    </div>
    <div id="pendingBox" style="display:none" class="pending-note">Your account is waiting for the headmaster to approve it. Check back once approved.</div>
    <div id="markArea" style="display:none">
      <div class="seg" style="margin-bottom:14px">
        <button id="mode_att" class="on" data-s="present" style="flex:1" onclick="setMode('att')">Attendance</button>
        <button id="mode_grade" style="flex:1;background:#fff;color:var(--slate);border:1px solid var(--hairline);border-radius:6px;font-size:12px;font-weight:600;padding:8px 10px" onclick="setMode('grade')">Grades</button>
      </div>
      <div class="controls">
        <select id="m_class"></select>
        <input id="m_date" type="date">
      </div>
      <button id="allBtn" class="btn-sec btn" style="margin:0 0 14px" onclick="allPresent()">Mark all present</button>
      <div id="roster" class="card"><div class="empty">Pick a class.</div></div>
      <div class="bar"><button class="btn" onclick="save()">Save</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://gthlpszvpvtoqkodbeaa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IKmG6K1F7mKEDEb7jh3CtA_bwi86Tk3';
const TEACHER_PORTAL_URL = 'https://santa-aurelia.vercel.app/teacher.html';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const el = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SIGNUP=false, ME=null, TERM=null, MYCLASSES=[], ROSTER=[], STATUS={}, MODE='att', GVAL={};

function setMode(m){
  MODE=m;
  el('mode_att').className = m==='att'?'on':'';
  el('mode_att').setAttribute('data-s','present');
  el('mode_grade').style.background = m==='grade'?'var(--brass-soft)':'#fff';
  el('mode_grade').style.color = m==='grade'?'var(--brass)':'var(--slate)';
  el('mode_att').style.background = m==='att'?'var(--green-bg)':'#fff';
  el('mode_att').style.color = m==='att'?'var(--green)':'var(--slate)';
  el('m_date').style.display = m==='att'?'block':'none';
  el('allBtn').style.display = m==='att'?'block':'none';
  loadRoster();
}

el('toggleMode').addEventListener('click', ()=>{
  SIGNUP=!SIGNUP;
  el('authTitle').textContent = SIGNUP?'Create account':'Teacher sign in';
  el('nameRow').style.display = SIGNUP?'block':'none';
  el('authBtn').textContent = SIGNUP?'Create account':'Sign in';
  el('toggleMode').textContent = SIGNUP?'Have an account? Sign in':'New here? Create an account';
  el('resendConfirm').style.display='none';
  el('authMsg').textContent='';
});

el('authBtn').addEventListener('click', async ()=>{
  const msg = el('authMsg'); msg.textContent=''; msg.style.color='var(--slate)';
  const email = el('t_email').value.trim(), pass = el('t_pass').value;
  if(!email||!pass){ msg.style.color='var(--rust)'; msg.textContent='Email and password required.'; return; }
  if(SIGNUP){
    const name = el('t_name').value.trim();
    if(!name){ msg.style.color='var(--rust)'; msg.textContent='Enter your name.'; return; }
    const { error } = await sb.auth.signUp({
      email,
      password:pass,
      options:{
        data:{ name, account_role:'teacher' },
        emailRedirectTo:TEACHER_PORTAL_URL
      }
    });
    if(error){ msg.style.color='var(--rust)'; msg.textContent=error.message; return; }
    msg.style.color='var(--green)';
    msg.textContent='Account created. Check your email and click the verification link, then return here to sign in.';
    el('resendConfirm').style.display='block';
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password:pass });
    if(error){ msg.style.color='var(--rust)'; msg.textContent=error.message; return; }
    boot();
  }
});
el('resendConfirm').addEventListener('click', async ()=>{
  const msg = el('authMsg');
  const email = el('t_email').value.trim();
  if(!email){ msg.style.color='var(--rust)'; msg.textContent='Enter your email address first.'; return; }
  const button = el('resendConfirm');
  button.disabled=true;
  msg.style.color='var(--slate)'; msg.textContent='Sending a new verification email…';
  const { error } = await sb.auth.resend({
    type:'signup', email,
    options:{ emailRedirectTo:TEACHER_PORTAL_URL }
  });
  button.disabled=false;
  if(error){ msg.style.color='var(--rust)'; msg.textContent=error.message; return; }
  msg.style.color='var(--green)';
  msg.textContent='A new verification email was sent. Use only the newest link.';
});
el('t_out').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ el('auth').style.display='block'; el('tapp').style.display='none'; return; }
  const { data:me } = await sb.from('admin_users').select('id,name,role,status').eq('id',session.user.id).maybeSingle();
  if(!me){ el('auth').style.display='block'; el('authMsg').style.color='var(--rust)'; el('authMsg').textContent='No staff record. Create an account.'; return; }
  if(me.role!=='teacher'){
    await sb.auth.signOut();
    el('auth').style.display='block'; el('tapp').style.display='none';
    el('authMsg').style.color='var(--rust)'; el('authMsg').textContent='This app is for approved teacher accounts only.';
    return;
  }
  ME = me;
  el('auth').style.display='none'; el('tapp').style.display='block';
  el('t_who').textContent = me.name;
  if(me.status!=='approved'){ el('pendingBox').style.display='block'; el('markArea').style.display='none'; return; }
  el('pendingBox').style.display='none'; el('markArea').style.display='block';
  loadClasses();
}

async function loadClasses(){
  const term = await sb.from('terms').select('*').eq('is_active',true).limit(1).maybeSingle();
  TERM = term.data || null;
  if(!TERM){
    MYCLASSES=[]; ROSTER=[];
    el('m_class').innerHTML='';
    el('roster').innerHTML='<div class="empty">No active school term has been set yet.</div>';
    return;
  }
  const { data, error } = await sb.from('classes').select('*').eq('teacher_id',ME.id).eq('term_id',TERM.id).order('name');
  if(error){
    MYCLASSES=[]; ROSTER=[];
    el('m_class').innerHTML='';
    el('roster').innerHTML='<div class="empty">Could not load your class assignments. Please contact the school office.</div>';
    return;
  }
  MYCLASSES = data||[];
  el('m_class').innerHTML = MYCLASSES.length ? MYCLASSES.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') : '';
  el('m_date').value = new Date().toISOString().slice(0,10);
  el('m_class').onchange = loadRoster;
  el('m_date').onchange = loadRoster;
  if(MYCLASSES.length) loadRoster(); else el('roster').innerHTML='<div class="empty">No classes assigned yet.</div>';
}

async function loadRoster(){
  const classId = el('m_class').value, date = el('m_date').value;
  if(!classId||!TERM){ el('roster').innerHTML='<div class="empty">No class.</div>'; return; }
  if(!MYCLASSES.some(c=>c.id===classId)){
    ROSTER=[];
    el('roster').innerHTML='<div class="empty">You are not assigned to this class.</div>';
    return;
  }
  const { data:enr } = await sb.from('enrollments').select('student_id, students(name,grade_level)').eq('class_id',classId).eq('term_id',TERM.id).eq('status','enrolled');
  ROSTER = (enr||[]).map(e=>({ id:e.student_id, name:e.students?.name||'—', grade:e.students?.grade_level||'' }));
  if(MODE==='att'){
    const { data:att } = await sb.from('attendance').select('student_id,status').eq('class_id',classId).eq('date',date);
    STATUS = {}; ROSTER.forEach(s=>STATUS[s.id]='present'); (att||[]).forEach(a=>STATUS[a.student_id]=a.status);
  } else {
    const { data:gr } = await sb.from('grades').select('*').eq('class_id',classId).eq('term_id',TERM.id).eq('assessment','Term grade');
    GVAL = {}; (gr||[]).forEach(g=>GVAL[g.student_id]={ id:g.id, score:g.score, label:g.label, comment:g.comment });
  }
  render();
}

function render(){
  if(!ROSTER.length){ el('roster').innerHTML='<div class="empty">No students enrolled in this class.</div>'; return; }
  if(MODE==='att'){
    const seg = sid => ['present','absent','late','excused'].map(s=>`<button data-s="${s}" class="${STATUS[sid]===s?'on':''}" onclick="setS('${sid}','${s}')">${s.charAt(0).toUpperCase()+s.slice(1,3)}</button>`).join('');
    el('roster').innerHTML = ROSTER.map(s=>`<div class="stat"><div class="who">${esc(s.name)}<small>${esc(s.grade)}</small></div><div class="seg">${seg(s.id)}</div></div>`).join('');
  } else {
    el('roster').innerHTML = ROSTER.map(s=>{
      const g = GVAL[s.id]||{};
      return `<div class="stat" style="flex-direction:column;align-items:stretch;gap:8px" data-student="${s.id}" data-gid="${g.id||''}">
        <div class="who">${esc(s.name)}<small>${esc(s.grade)}</small></div>
        <div style="display:flex;gap:8px">
          <input class="g-score" type="number" step="0.01" placeholder="Score" value="${g.score!=null?g.score:''}" style="flex:1">
          <input class="g-label" placeholder="Grade" value="${esc(g.label||'')}" style="width:90px">
        </div>
        <input class="g-comment" placeholder="Comment (optional)" value="${esc(g.comment||'')}">
      </div>`;
    }).join('');
  }
}
function setS(sid,s){ STATUS[sid]=s; render(); }
function allPresent(){ ROSTER.forEach(s=>STATUS[s.id]='present'); render(); }

async function save(){
  const classId = el('m_class').value, date = el('m_date').value;
  if(!classId||!ROSTER.length){ alert('Nothing to save.'); return; }
  if(!MYCLASSES.some(c=>c.id===classId)){ alert('You are not assigned to this class.'); return; }
  if(MODE==='att'){
    const rows = ROSTER.map(s=>({ class_id:classId, student_id:s.id, date, status:STATUS[s.id]||'present', marked_by:ME.id }));
    const { error } = await sb.from('attendance').upsert(rows, { onConflict:'class_id,student_id,date' });
    if(error){ alert('Could not save: '+error.message); return; }
    alert('Attendance saved for '+ROSTER.length+' students.');
  } else {
    const inserts=[], updates=[];
    [...document.querySelectorAll('#roster [data-student]')].forEach(row=>{
      const sid=row.dataset.student, gid=row.dataset.gid;
      const score=row.querySelector('.g-score').value, label=row.querySelector('.g-label').value.trim(), comment=row.querySelector('.g-comment').value.trim();
      if(score==='' && !label && !comment) return;
      const rec={ student_id:sid, class_id:classId, term_id:TERM.id, assessment:'Term grade', score:score===''?null:Number(score), label:label||null, comment:comment||null, entered_by:ME.id };
      if(gid) updates.push({id:gid,...rec}); else inserts.push(rec);
    });
    let err=null;
    if(inserts.length){ const r=await sb.from('grades').insert(inserts); err=err||r.error; }
    for(const u of updates){ const {id,...rest}=u; const r=await sb.from('grades').update(rest).eq('id',id); err=err||r.error; }
    if(err){ alert('Could not save: '+err.message); return; }
    alert('Grades saved.');
    loadRoster();
  }
}

boot();
</script>
</body>
</html>
